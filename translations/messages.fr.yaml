    subtitle: 'Nous pouvons échanger et travailler en français ou en espagnol.'
    paris:
      title: France
      desc: 'Un accompagnement pour les petites structures et associations, en Île-de-France comme ailleurs en France. Les modalités de rencontre sont convenues ensemble.'
    spain:
      title: Espagne
      desc: 'J’accompagne aussi les projets établis en Espagne, avec des échanges en espagnol et une organisation du projet à distance.'
  cta:
    title: 'Faisons connaissance'
    subtitle: 'Présentez-moi votre structure et ce que vous souhaitez améliorer.'
    button: 'Parler de mon projet'
