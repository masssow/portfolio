tarifs:
  seo:
    titleTab: 'Tarifs développeur indépendant — Massgrafik'
    metaDesc: 'Repères de budget : site vitrine dès 990 €, site et outil de gestion dès 1 890 €, application sur mesure dès 3 200 €. Devis adapté à votre besoin.'
  hero:
    title: 'Un budget cadré, un projet adapté'
    subtitle: 'Je vous aide à prioriser ce qui compte et à construire un périmètre réaliste.'
  faq:
    title: 'Vos questions sur le budget'
    items:
      1:
        q: 'Que signifient les prix affichés ?'
        a: 'Ce sont des prix de départ hors taxes. Le montant final dépend du périmètre. Votre devis détaille les livrables, les prestations et les éventuels abonnements ou frais tiers.'
      2:
        q: 'Puis-je commencer par un petit projet ?'
        a: 'Oui. Nous pouvons définir une première version utile, puis prévoir des évolutions selon vos retours et votre budget.'
      3:
        q: 'Comment se passent les paiements ?'
        a: 'L’acompte, les échéances et les modalités de règlement sont précisés dans le devis avant le démarrage.'
      4:
        q: 'L’hébergement et la maintenance sont-ils inclus ?'
        a: 'Le devis précise l’hébergement, le nom de domaine, les renouvellements et le suivi technique. La maintenance peut faire l’objet d’un accompagnement distinct.'
      5:
        q: 'Accompagnez-vous les associations ?'
        a: 'Oui. Nous partons de vos usages, de votre budget et de vos ressources humaines pour définir les priorités et la prise en main.'
