home:
  seo:
    titleTab: 'Développeur indépendant pour petites structures — Massgrafik'
    metaDesc: 'Samba Sow accompagne les petites entreprises et associations : création de sites web, outils de gestion et automatisations en France et en Espagne.'
  hero:
    salutation: 'Samba Sow · Développeur indépendant'
    h1: 'Un site utile. Des outils simples. Un accompagnement à votre rythme.'
    subtitle: 'Avec Massgrafik, j’aide les petites structures et les associations à être visibles et à mieux s’organiser. Nous partons de votre quotidien pour construire ce qui vous sera vraiment utile.'
    proofs: 'Un interlocuteur direct · Des priorités claires · Un projet progressif'
  mirror:
    title: 'Votre quotidien est le point de départ'
    subtitle: 'Pas besoin d’avoir déjà la solution : décrivez-moi ce qui vous freine.'
    items:
      1:
        title: 'Votre activité manque de visibilité'
        text: 'Votre site ne présente plus vos services, vos actions ou les informations que vos visiteurs cherchent.'
      2:
        title: 'Vos informations sont dispersées'
        text: 'Tableurs, messages, documents : retrouver une demande ou suivre une inscription devient compliqué.'
      3:
        title: 'Vous souhaitez lancer un nouveau service'
        text: 'Vente en ligne, réservation, adhésions : vous avez besoin de savoir par où commencer.'
      4:
        title: 'Vous avez peu de temps et un budget à respecter'
        text: 'Vous cherchez une première étape réaliste, puis des améliorations au fil des besoins.'
  method:
    title: 'Une démarche simple, du besoin à la prise en main'
    steps:
      1:
        num: '01'
        title: 'Je vous écoute'
        desc: 'Nous faisons le point sur votre activité, vos publics, vos contraintes et vos priorités.'
      2:
        num: '02'
        title: 'Je propose un cadre clair'
        desc: 'Je vous présente une solution et un devis : périmètre, budget, étapes et suivi envisagé.'
      3:
        num: '03'
        title: 'Je développe et je vous accompagne'
        desc: 'Vous suivez les avancées. Je vous aide à prendre en main votre outil et nous définissons les prochaines évolutions.'
  personal:
    title: 'Derrière Massgrafik, il y a Samba'
    text: 'Je suis développeur indépendant. Massgrafik est le nom que j’ai donné à ma démarche : comprendre votre réalité, créer des outils utiles et vous aider à les utiliser avec autonomie.'
  cta_center:
    title: 'Commençons par votre besoin'
    subtitle: 'Un site à créer, un outil à améliorer ou une idée encore floue ? Racontez-moi votre projet et vos contraintes.'
    button: 'Parler de mon projet'
    proof: 'Les modalités de réalisation seront précisées dans votre devis.'
about:
  seo:
    titleTab: 'Samba Sow et la démarche Massgrafik'
    metaDesc: 'Découvrez Samba Sow, développeur indépendant, et Massgrafik : une démarche de proximité pour les petites structures et associations en France et en Espagne.'
  hero:
    title: 'Samba Sow, votre interlocuteur du début à la suite'
    subtitle: 'Développeur indépendant, j’ai créé Massgrafik pour accompagner les petites structures dans leurs projets numériques.'
  philosophy:
    title: 'Massgrafik, une démarche d’accompagnement'
    text1: 'Un site ou une application a de la valeur lorsqu’il répond à un besoin concret. Je prends le temps de comprendre votre fonctionnement avant de proposer une solution technique.'
    text2: 'Mon objectif : vous aider à présenter votre activité, simplifier votre organisation et utiliser vos outils avec confiance. Nous avançons par étapes adaptées à vos moyens.'
  values:
    title: 'Ce qui guide mon travail'
    items:
      1:
        title: Écoute
        desc: 'Comprendre votre activité, vos publics et vos contraintes avant de développer.'
        icon: fa-handshake
      2:
        title: Clarté
        desc: 'Expliquer les choix et les étapes avec des mots simples.'
        icon: fa-circle-check
      3:
        title: Utilité
        desc: 'Relier chaque fonctionnalité à un usage concret.'
        icon: fa-bullseye
      4:
        title: Autonomie
        desc: 'Vous aider à prendre en main ce qui a été construit pour vous.'
        icon: fa-stairs
  forwho:
    title: 'Pour les structures qui font beaucoup avec peu'
    intro: 'J’accompagne en priorité les personnes qui ont besoin d’un partenaire technique accessible.'
    items:
      1: 'Associations et collectifs'
      2: 'Très petites entreprises'
      3: 'Artisans et commerçants'
      4: 'Indépendants et prestataires'
      5: 'Petites équipes de terrain'
      6: 'Porteurs de projets locaux'
