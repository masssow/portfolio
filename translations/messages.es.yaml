tarifs:
  seo:
    titleTab: 'Precios de desarrollador independiente — Massgrafik'
    metaDesc: 'Referencias de presupuesto: web desde 990 €, web y herramienta de gestión desde 1 890 €, aplicación a medida desde 3 200 €. Propuesta adaptada a tu necesidad.'
  hero:
    title: 'Un presupuesto claro, un proyecto adaptado'
    subtitle: 'Te ayudo a priorizar lo importante y definir un alcance realista.'
  faq:
    title: 'Tus preguntas sobre el presupuesto'
    items:
      1:
        q: '¿Qué significan los precios publicados?'
        a: 'Son precios de partida sin impuestos. El importe final depende del alcance. Tu presupuesto detalla los entregables, los servicios y las posibles suscripciones o gastos externos.'
      2:
        q: '¿Puedo empezar con un proyecto pequeño?'
        a: 'Sí. Podemos definir una primera versión útil y planificar mejoras según tu experiencia y tu presupuesto.'
      3:
        q: '¿Cómo se organizan los pagos?'
        a: 'El anticipo, los plazos y las condiciones de pago se detallan en el presupuesto antes de empezar.'
      4:
        q: '¿Se incluyen el alojamiento y el mantenimiento?'
        a: 'El presupuesto especifica el alojamiento, el dominio, las renovaciones y el seguimiento técnico. El mantenimiento puede acordarse como acompañamiento separado.'
      5:
        q: '¿Acompañas a asociaciones?'
        a: 'Sí. Partimos de tus usos, presupuesto y recursos humanos para definir las prioridades y facilitar el aprendizaje.'
