name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Configurer la connexion SSH
      - name: Set up SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<-EOF
          Host hostinger
            HostName 178.16.128.226
            User u791166429
            Port 65002
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOF
      # Étape 3 : Déployer le projet Symfony via SSH
      - name: Deploy to Hostinger
        shell: bash
        run: |
          ssh -T -o BatchMode=yes hostinger "bash -se -- '$GITHUB_SHA'" << 'EOF'
            set -euo pipefail
            export APP_ENV=prod
            export APP_DEBUG=0

            expected_sha="$1"
            cd /home/u791166429/domains/massgrafik.com/public_html

            if ! command -v npm >/dev/null 2>&1; then
              echo "Deployment stopped: npm is not available in the SSH shell PATH."
              exit 1
            fi

            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "$expected_sha" ]; then
              echo "Deployment stopped: this workflow no longer targets the latest main commit."
              exit 1
            fi
            git checkout main
            # Fast-forward preserves unrelated server settings and refuses conflicts.
            git merge --ff-only FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$expected_sha"

            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            npm ci --include=dev
            npm run build
            test -s public/build/entrypoints.json

            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=prod --no-debug
            php bin/console cache:clear --env=prod --no-debug --no-warmup
            php bin/console cache:warmup --env=prod --no-debug

            echo "Deployment completed at $(git rev-parse --short HEAD)."
          EOF
